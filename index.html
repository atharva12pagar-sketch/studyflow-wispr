<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Student Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>StudyFlow</h1>
      <p>Simple study planning for busy students</p>
    </div>
    <button id="clearAll" class="danger">Clear All</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h2>Plan. Focus. Finish.</h2>
        <p>Add your study tasks, track progress, and stay focused.</p>
      </div>
      <div class="stats">
        <div><strong id="totalTasks">0</strong><span>Total</span></div>
        <div><strong id="completedTasks">0</strong><span>Done</span></div>
        <div><strong id="pendingTasks">0</strong><span>Pending</span></div>
      </div>
    </section>

    <section class="card">
      <h3>Add Study Task</h3>
      <form id="taskForm">
        <input id="taskInput" type="text" placeholder="e.g. Revise Blockchain Unit 6" required>
        <select id="subjectInput">
          <option>Blockchain</option>
          <option>Cyber Security</option>
          <option>Data Science</option>
          <option>Java</option>
          <option>Other</option>
        </select>
        <select id="priorityInput">
          <option>High</option>
          <option selected>Medium</option>
          <option>Low</option>
        </select>
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section class="toolbar">
      <h3>My Tasks</h3>
      <div>
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </section>

    <section id="taskList" class="task-list"></section>

    <section id="emptyState" class="empty card">
      <div class="empty-icon">✓</div>
      <h3>No tasks yet</h3>
      <p>Add your first study task above.</p>
    </section>
  </main>

  <footer>StudyFlow • Built with HTML, CSS and JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
